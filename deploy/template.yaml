AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
Description: "Digital Identity IPV CRI Open Banking API"
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - E3030 # ignore as nodejs24.x is available for lambda runtime

Parameters:
  Environment:
    Description: The environment type
    Type: "String"
    AllowedValues:
      - "dev"
      - "build"
      - "staging"
      - "integration"
      - "production"
    ConstraintDescription: must be dev, build, staging, integration or production
  VpcStackName:
    Description: >
      The name of the stack that defines the VPC in which this container will
      run.
    Type: String
    Default: "cri-vpc"
  PermissionsBoundary:
    Description: The ARN of the permissions boundary to apply when creating IAM roles
    Type: String
    Default: "none"
  CodeSigningConfigArn:
    Type: String
    Description: >
      The ARN of the Code Signing Config to use, provided by the deployment pipeline
    Default: "none"
  AuditEventNamePrefix:
    Description: The audit event name prefix
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/common-cri-parameters/AuditEventNamePrefix"
  CriIdentifier:
    Description: The unique credential issuer identifier
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/common-cri-parameters/CriIdentifier"
  ParameterPrefix:
    Type: String
    Default: "none"
    Description: If set this value will be used as the ParameterStore prefix instead of AWS::StackName
  DeploymentType:
    Type: String
    Default: "pipeline"
    Description: Private Api gateway resources are not be reachable in stacks deployed via pipelines, this override enables less restrictive settings for manual/pre-merge-test deployments.
  LogGroupRetentionInDays:
    Description: Retention for all log groups
    Type: Number
    Default: "30"
  LambdaDeploymentPreference:
    Description: "Specifies the configuration to enable gradual Lambda deployments"
    Type: String
    Default: AllAtOnce

Conditions:
  IsDeployedFromPipeline: !Equals
    - !Ref DeploymentType
    - "pipeline"
  IsNotDeployedFromPipeline: !Not
    - !Condition IsDeployedFromPipeline
  # Alarms only enabled in pipelines by default
  AlarmsEnabled: !Equals
    - !Ref DeploymentType
    - "pipeline"
  # Don't send logs in dev to avoid overwhelming the destination with debug
  # TODO: Uncomment if log group subscription filters are uncommented
  # LogSendingEnabled: !And
  #   - !Not [ !Equals [ !Ref Environment, "dev" ] ]
  #   - !Condition IsDeployedFromPipeline
  IsProduction: !Equals [ !Ref Environment, production ]
  UsePermissionsBoundary: !Not
    - !Equals [ !Ref PermissionsBoundary, "none" ]
  UseCodeSigning: !Not
    - !Equals [ !Ref CodeSigningConfigArn, "none" ]
  UseCanaryDeploymentAlarms: !Not
      - !Equals [ !Ref LambdaDeploymentPreference, AllAtOnce ]
  AddProvisionedConcurrency: !Not
    - !Equals
      - !FindInMap [ EnvironmentConfiguration, !Ref Environment, provisionedConcurrentExecutions ]
      - 0
  UseParameterPrefix: !Not
    - !Equals [ !Ref ParameterPrefix, "none"]
  IsNotProduction: !Not [ !Equals [ !Ref Environment, production ] ]
  CreateTestResourcesParam: !And
    - !Condition IsDeployedFromPipeline
    - !Condition IsNotProduction

Globals:
  Function:
    CodeSigningConfigArn: !If
      - UseCodeSigning
      - !Ref CodeSigningConfigArn
      - !Ref AWS::NoValue
    PermissionsBoundary: !If
      - UsePermissionsBoundary
      - !Ref PermissionsBoundary
      - !Ref AWS::NoValue
    Runtime: nodejs24.x
    Tracing: Active
    Timeout: 40
    MemorySize: !FindInMap [ EnvironmentConfiguration, !Ref Environment, memorySize ]
    Architectures:
      - arm64
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/dynatrace
        DT_CONNECTION_AUTH_TOKEN: !Sub
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_AUTH_TOKEN}}'
          - SecretArn: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dynatraceSecretArn ]
        DT_CONNECTION_BASE_URL: !Sub
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CONNECTION_BASE_URL}}'
          - SecretArn: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dynatraceSecretArn ]
        DT_CLUSTER: !Sub
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:DT_CLUSTER_ID}}'
          - SecretArn: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dynatraceSecretArn ]
        DT_LOG_COLLECTION_AUTH_TOKEN: !Sub
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:DT_LOG_COLLECTION_AUTH_TOKEN}}'
          - SecretArn: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dynatraceSecretArn ]
        DT_TENANT: !Sub
          - '{{resolve:secretsmanager:${SecretArn}:SecretString:DT_TENANT}}'
          - SecretArn: !FindInMap [ EnvironmentConfiguration, !Ref Environment, dynatraceSecretArn ]
        AWS_STACK_NAME: !Sub ${AWS::StackName}
        POWERTOOLS_LOG_LEVEL: INFO
        POWERTOOLS_METRICS_NAMESPACE: !Ref CriIdentifier
        ENVIRONMENT: !Ref Environment
        PARAMETER_PREFIX: !If [UseParameterPrefix, !Ref ParameterPrefix , !Ref AWS::StackName]
    Layers:
      # SEE https://github.com/govuk-one-login/observability-infrastructure/tree/main/lambdalayer
      - !FindInMap [ EnvironmentConfiguration, !Ref Environment, dynatraceLayer ]
Mappings:
  EnvironmentConfiguration:
    dev:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      dynatraceLayer: arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1
      provisionedConcurrentExecutions: 0
      memorySize: 1024
      vcDomain: review-ob.dev.account.gov.uk
      tokenRotatorProfiles: STUB|UAT
      bankListUpdaterProfiles: STUB|UAT
    build:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      dynatraceLayer: arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1
      provisionedConcurrentExecutions: 1
      memorySize: 1024
      vcDomain: review-ob.build.account.gov.uk
      tokenRotatorProfiles: STUB|UAT
      bankListUpdaterProfiles: STUB|UAT
    staging:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      dynatraceLayer: arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1
      provisionedConcurrentExecutions: 1
      memorySize: 1024
      vcDomain: review-ob.staging.account.gov.uk
      tokenRotatorProfiles: STUB|UAT
      bankListUpdaterProfiles: STUB|UAT
    integration:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceNonProductionVariables
      dynatraceLayer: arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1
      provisionedConcurrentExecutions: 1
      memorySize: 1024
      vcDomain: review-ob.integration.account.gov.uk
      tokenRotatorProfiles: UAT
      bankListUpdaterProfiles: UAT
    production:
      dynatraceSecretArn: arn:aws:secretsmanager:eu-west-2:216552277552:secret:DynatraceProductionVariables
      dynatraceLayer: arn:aws:lambda:eu-west-2:216552277552:layer:Dynatrace_OneAgent_1_329_73_20260123-140641_with_collector_nodejs_arm:1
      provisionedConcurrentExecutions: 1
      memorySize: 1024
      vcDomain: review-ob.account.gov.uk
      tokenRotatorProfiles: LIVE
      bankListUpdaterProfiles: LIVE

  # Local Dev
  IPVCoreStubLocalMapping:
    dev:
      redirectUri: "http://localhost:8085/callback"
      issuer: "https://cri.core.build.stubs.account.gov.uk"
      audience: "https://review-ob.dev.account.gov.uk"
      publicSigningJwkBase64Mapping: ""
      authenticationAlg: "ES256"
      jwksEndpoint: "https://cri.core.build.stubs.account.gov.uk/.well-known/jwks.json"

  ProfileEndpointMappings:
    dev:
      StubBanksEndpointUrl: https://8nqpgft8mc.execute-api.eu-west-2.amazonaws.com/dev/api/v2.0/banks
      UatBanksEndpointUrl: https://aisapi.sb.ecospend.com/api/v2.0/banks
      LiveBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks
    build:
      StubBanksEndpointUrl: https://babtt0cp72.execute-api.eu-west-2.amazonaws.com/build/api/v2.0/banks
      UatBanksEndpointUrl: https://aisapi.sb.ecospend.com/api/v2.0/banks
      LiveBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks
    staging:
      StubBanksEndpointUrl: https://52wrvaocmk.execute-api.eu-west-2.amazonaws.com/staging/api/v2.0/banks
      UatBanksEndpointUrl: https://aisapi.sb.ecospend.com/api/v2.0/banks
      LiveBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks
    integration:
      StubBanksEndpointUrl: https://aisapi.sb.ecospend.com/api/v2.0/banks
      UatBanksEndpointUrl: https://aisapi.sb.ecospend.com/api/v2.0/banks
      LiveBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks
    production:
      StubBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks
      UatBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks
      LiveBanksEndpointUrl: https://aisapi.ecospend.com/api/v2.0/banks



Resources:

  ####################################################################
  #                                                                  #
  # OAuth Common                                                     #
  #                                                                  #
  ####################################################################

  OAuth:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:eu-west-2:667736788427:applications/di-ipv-cri-oauth-common
        SemanticVersion: 1.2.4
      Parameters:
        AuditEventNamePrefix: !Ref AuditEventNamePrefix
        CriIdentifier: !Ref CriIdentifier
        CriAudience: !Sub
          - "https://${domain}"
          - domain: !FindInMap [EnvironmentConfiguration, !Ref Environment, vcDomain]
        CriVcIssuer: !Sub
          - "https://${domain}"
          - domain: !FindInMap [EnvironmentConfiguration, !Ref Environment, vcDomain]
        CriPrivateApiGwName: !Sub ${AWS::StackName}-private
        CriPublicApiGwName: !Sub ${AWS::StackName}-public
        Environment: !Ref Environment
        IPVCoreRedirectURI: https://cri.core.build.stubs.account.gov.uk/callback
        IPVCoreStubJwksEndpoint: https://cri.core.stubs.account.gov.uk/.well-known/jwks.json
        LambdaVpcConfiguration: di-devplatform-deploy
        LambdaProvisionedConcurrentExecutions: !FindInMap [ EnvironmentConfiguration, !Ref Environment, provisionedConcurrentExecutions ]
        PermissionsBoundaryArn: !If
          - UsePermissionsBoundary
          - !Ref PermissionsBoundary
          - !Ref AWS::NoValue
        LambdaCodeSigningConfigArn: !Ref CodeSigningConfigArn
        LambdaDeploymentPreference: !Ref LambdaDeploymentPreference

  ####################################################################
  #                                                                  #
  # OAuth JWKS                                                       #
  #                                                                  #
  ####################################################################

  JWKSBucketRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: "sts:AssumeRole"
            Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
        Version: 2012-10-17
      Policies:
        - PolicyName: AccessJWKSJson
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:Get*"
                Resource:
                  - !Sub "arn:aws:s3:::govuk-one-login-ob-published-keys-${Environment}/jwks.json"
      PermissionsBoundary: !If
        - UsePermissionsBoundary
        - !Ref PermissionsBoundary
        - !Ref AWS::NoValue
      Tags:
        - Key: "key_consumer_type"
          Value: "use"

  ####################################################################
  #                                                                  #
  # API Gateway                                                      #
  #                                                                  #
  ####################################################################

  PublicAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-PublicOpenBankingAPI
      Description: Public Open Banking CRI API
      StageName: !Ref Environment
      MethodSettings:
        - LoggingLevel: INFO
          ResourcePath: '/*'
          HttpMethod: '*'
          # Disable data trace in production to avoid logging customer sensitive information
          DataTraceEnabled: !If [IsProduction, false, true]
          MetricsEnabled: true
          ThrottlingRateLimit: 200
          ThrottlingBurstLimit: 400
      AccessLogSetting:
        DestinationArn: !GetAtt PublicAPILogGroup.Arn
        Format: >-
          {
          "requestId":"$context.requestId",
          "ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod",
          "path":"$context.path",
          "routeKey":"$context.routeKey",
          "status":"$context.status",
          "protocol":"$context.protocol",
          "responseLatency":"$context.responseLatency",
          "responseLength":"$context.responseLength"
          }
      TracingEnabled: true
      DefinitionBody:
        openapi: "3.0.1" # workaround to get `sam validate` to work
        paths: # workaround to get `sam validate` to work
          /never-created:
            options: { } # workaround to get `sam validate` to work
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: './public-api.yaml'
      OpenApiVersion: 3.0.1
      EndpointConfiguration:
        Type: REGIONAL
      Tags:
        FMSRegionalPolicy: "false"
        CustomPolicy: "true"

  PublicAPILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-${PublicAPI}-public-AccessLogs
      RetentionInDays: !Ref LogGroupRetentionInDays
      KmsKeyId: !GetAtt LoggingKmsKey.Arn

  # PublicAPILogGroupSubscriptionFilter: #to be confirmed
  #   Type: AWS::Logs::SubscriptionFilter
  #   Condition: LogSendingEnabled
  #   Properties:
  #     DestinationArn: "arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2"
  #     FilterPattern: ""
  #     LogGroupName: !Ref PublicAPILogGroup

  PrivateAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-PrivateOpenBankingAPI
      Description: Private Open Banking CRI API
      MethodSettings:
        - LoggingLevel: INFO
          ResourcePath: '/*'
          HttpMethod: '*'
          # Disable data trace in production to avoid logging customer sensitive information
          DataTraceEnabled: !If [IsProduction, false, true]
          MetricsEnabled: true
          ThrottlingRateLimit: 200
          ThrottlingBurstLimit: 400
      AccessLogSetting:
        DestinationArn: !GetAtt PrivateAPILogGroup.Arn
        Format: >-
          {
          "requestId":"$context.requestId",
          "ip":"$context.identity.sourceIp",
          "requestTime":"$context.requestTime",
          "httpMethod":"$context.httpMethod",
          "path":"$context.path",
          "routeKey":"$context.routeKey",
          "status":"$context.status",
          "protocol":"$context.protocol",
          "responseLatency":"$context.responseLatency",
          "responseLength":"$context.responseLength"
          }
      TracingEnabled: true
      StageName: !Ref Environment
      DefinitionBody:
        openapi: "3.0.1" # workaround to get `sam validate` to work
        paths: # workaround to get `sam validate` to work
          /never-created:
            options: { } # workaround to get `sam validate` to work
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: './private-api.yaml'
      OpenApiVersion: 3.0.1
      EndpointConfiguration:
        Type: !If [IsDeployedFromPipeline, PRIVATE, REGIONAL]
      Auth:
        ResourcePolicy:
          CustomStatements:
            - Action: 'execute-api:Invoke'
              Effect: Allow
              Principal: '*'
              Resource:
                - 'execute-api:/*'
            - !If
              - IsDeployedFromPipeline
              - Action: 'execute-api:Invoke'
                Effect: Deny
                Principal: '*'
                Resource:
                  - 'execute-api:/*'
                Condition:
                  StringNotEquals:
                    aws:SourceVpce:
                      - Fn::ImportValue:
                          !Sub "${VpcStackName}-ExecuteApiGatewayEndpointId"
              - !Ref AWS::NoValue
      Tags:
        FMSRegionalPolicy: "false"
        CustomPolicy: "true"

  PrivateAPILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-${PrivateAPI}-private-AccessLogs
      RetentionInDays: !Ref LogGroupRetentionInDays
      KmsKeyId: !GetAtt LoggingKmsKey.Arn

  # PrivateAPILogGroupSubscriptionFilter: #to be confirmed
  #   Type: AWS::Logs::SubscriptionFilter
  #   Condition: LogSendingEnabled
  #   Properties:
  #     DestinationArn: "arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython"
  #     FilterPattern: ""
  #     LogGroupName: !Ref PrivateAPILogGroup

  ####################################################################
  #                                                                  #
  # Issue Credential Function                                        #
  #                                                                  #
  ####################################################################

  IssueCredentialFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-issue-credential"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-PrivateSubnetIdA"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-PrivateSubnetIdB"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-PrivateSubnetIdC"
      Handler: issue-credential.handler
      CodeUri: ../
      LoggingConfig:
        LogGroup: !Ref IssueCredentialFunctionLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub "${CriIdentifier}-issue-credential"
          VC_DOMAIN: !FindInMap [EnvironmentConfiguration, !Ref Environment, vcDomain]
          JWT_TTL_SECONDS: "7200"
          KMS_SIGNING_KEY_ID: !ImportValue core-infrastructure-CriVcSigningKey1Id
          AUDIT_COMPONENT_ID: !FindInMap [EnvironmentConfiguration, !Ref Environment, vcDomain]
          AUDIT_EVENT_NAME_PREFIX: !Ref AuditEventNamePrefix
          AUDIT_QUEUE_URL: !ImportValue txma-infrastructure-AuditEventQueueUrl
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Enabled: true
        Type: !Ref LambdaDeploymentPreference
        Role: !GetAtt CodeDeployServiceRole.Arn
        Alarms: !If
          - UseCanaryDeploymentAlarms
          - [ !Ref IssueCredentialFunctionCanaryErrors, !Ref IssueCredentialFunctionCanary5xxErrors ]
          - [ !Ref AWS::NoValue ]
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - DynamoDBReadPolicy:
            TableName: !GetAtt OAuth.Outputs.DbSessionTableName
        - DynamoDBReadPolicy:
            TableName: !GetAtt OAuth.Outputs.DbPersonIdentityTableName
        - Statement:
            Effect: Allow
            Action: kms:Sign
            Resource: !ImportValue core-infrastructure-CriVcSigningKey1Arn
        - SQSSendMessagePolicy:
            QueueName: !ImportValue txma-infrastructure-AuditEventQueueName
        - Statement:
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !ImportValue txma-infrastructure-AuditEventQueueEncryptionKeyArn
      ProvisionedConcurrencyConfig:
        !If
        - AddProvisionedConcurrency
        - ProvisionedConcurrentExecutions: !FindInMap [ EnvironmentConfiguration, !Ref Environment, provisionedConcurrentExecutions ]
        - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Sourcemap: true
        Target: node24
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/issue-credential/handler/issue-credential.ts
        External:
          - "@aws-sdk/*"
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  IssueCredentialFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-issue-credential"
      RetentionInDays: !Ref LogGroupRetentionInDays

  IssueCredentialFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt IssueCredentialFunction.Arn
      Principal: apigateway.amazonaws.com

  IssueCredentialFunctionAliasPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IssueCredentialFunction.Alias
      Principal: apigateway.amazonaws.com

  ####################################################################
  #                                                                  #
  # Basic Function                                                   #
  #                                                                  #
  ####################################################################

  BasicFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-basic-function"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdA"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdB"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdC"
      Handler: basic-function.handler
      CodeUri: ../
      LoggingConfig:
        LogGroup: !Ref BasicFunctionLogGroup
      DeploymentPreference:
        Enabled: true
        Type: !Ref LambdaDeploymentPreference
        Role: !GetAtt CodeDeployServiceRole.Arn
        Alarms: !If
          - UseCanaryDeploymentAlarms
          - [ !Ref BasicFunctionCanaryErrors, !Ref BasicFunctionCanary5xxErrors ]
          - [ !Ref AWS::NoValue ]
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub "${CriIdentifier}-basic-function"
          TOKEN_ROTATOR_DB_TABLE_NAME: !Ref TokenRotatorTable
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - KMSDecryptPolicy:
            KeyId: !ImportValue core-infrastructure-CriDecryptionKey1Id
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt TokenRotatorTable.Arn
      ProvisionedConcurrencyConfig:
        !If
        - AddProvisionedConcurrency
        - ProvisionedConcurrentExecutions: !FindInMap [ EnvironmentConfiguration, !Ref Environment, provisionedConcurrentExecutions ]
        - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Sourcemap: true
        Target: node24
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/basic-function/handler/basic-function.ts
        External:
          - '@aws-sdk/*'

  BasicFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-basic-function"
      RetentionInDays: !Ref LogGroupRetentionInDays

  # BasicFunctionLogGroupSubscriptionFilterCsls:
  #   Type: AWS::Logs::SubscriptionFilter
  #   Condition: LogSendingEnabled
  #   Properties:
  #     DestinationArn: "arn:aws:logs:eu-west-2:885513274347:destination:csls_cw_logs_destination_prodpython-2"
  #     FilterPattern: ""
  #     LogGroupName: !Ref BasicFunctionLogGroup

  BasicFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt BasicFunction.Arn
      Principal: apigateway.amazonaws.com

  BasicFunctionAliasPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BasicFunction.Alias
      Principal: apigateway.amazonaws.com

  ####################################################################
  #                                                                  #
  # Ecospend Token Rotator                                           #
  #                                                                  #
  ####################################################################

  TokenRotatorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-ecospend-tokens"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

  EcospendTokenRotatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ecospend-token-rotator"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdA"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdB"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdC"
      Handler: ecospend-token-rotator.handler
      CodeUri: ../
      LoggingConfig:
        LogGroup: !Ref EcospendTokenRotatorFunctionLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub "${CriIdentifier}-ecospend-token-rotator"
          TOKEN_ROTATOR_DB_TABLE_NAME: !Ref TokenRotatorTable
          TOKEN_ROTATOR_PROFILES: !FindInMap [ EnvironmentConfiguration, !Ref Environment, tokenRotatorProfiles ]
          TOKEN_ROTATOR_REFRESH_WINDOW_SECONDS: "900"
          TOKEN_ROTATOR_CREDENTIALS_PATH: !If
            - UseParameterPrefix
            - !Sub "/${ParameterPrefix}/ecospend-token-rotator"
            - !Sub "/${AWS::StackName}/ecospend-token-rotator"
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt TokenRotatorTable.Arn
        - SSMParameterReadPolicy:
            ParameterName: !If
              - UseParameterPrefix
              - !Sub "${ParameterPrefix}/ecospend-token-rotator/*"
              - !Sub "${AWS::StackName}/ecospend-token-rotator/*"
      Events:
        ScheduledRotation:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Sourcemap: true
        Target: node24
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/ecospend-token/handler/ecospend-token-rotator.ts
        External:
          - "@aws-sdk/*"
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  EcospendTokenRotatorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ecospend-token-rotator"
      RetentionInDays: !Ref LogGroupRetentionInDays

  ####################################################################
  #                                                                  #
  #  Bank List                                                       #
  #                                                                  #
  ####################################################################

  BankListTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-bank-list"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile
          AttributeType: S
      KeySchema:
        - AttributeName: profile
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]

  BankListUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-bank-list-updater"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdA"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdB"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-ProtectedSubnetIdC"
      Handler: bank-list-updater.handler
      CodeUri: ../
      LoggingConfig:
        LogGroup: !Ref BankListUpdaterFunctionLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub "${CriIdentifier}-bank-list-updater"
          TOKEN_ROTATOR_DB_TABLE_NAME: !Ref TokenRotatorTable
          BANK_LIST_DB_TABLE_NAME: !Ref BankListTable
          BANK_LIST_PROFILES: !FindInMap [ EnvironmentConfiguration, !Ref Environment, bankListUpdaterProfiles ]
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt TokenRotatorTable.Arn
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt BankListTable.Arn
        - SSMParameterReadPolicy:
            ParameterName: !If
              - UseParameterPrefix
              - !Sub "${ParameterPrefix}/bank-list/*"
              - !Sub "${AWS::StackName}/bank-list/*"
      Events:
        ScheduledUpdate:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Sourcemap: true
        Target: node24
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/bank-list/handler/bank-list-updater.ts
        External:
          - "@aws-sdk/*"
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  BankListRetrieverFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-bank-list-retriever"
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-AWSServicesEndpointSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue:
              !Sub "${VpcStackName}-PrivateSubnetIdA"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-PrivateSubnetIdB"
          - Fn::ImportValue:
              !Sub "${VpcStackName}-PrivateSubnetIdC"
      Handler: bank-list-retriever.handler
      CodeUri: ../
      LoggingConfig:
        LogGroup: !Ref BankListRetrieverFunctionLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: !Sub "${CriIdentifier}-bank-list-retriever"
          BANK_LIST_DB_TABLE_NAME: !Ref BankListTable
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXrayWriteOnlyAccess
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt BankListTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Sourcemap: true
        Target: node24
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - src/bank-list/handler/bank-list-retriever.ts
        External:
          - "@aws-sdk/*"
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  BankListUpdaterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-bank-list-updater"
      RetentionInDays: !Ref LogGroupRetentionInDays

  BankListRetrieverFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-bank-list-retriever"
      RetentionInDays: !Ref LogGroupRetentionInDays

  BankListRetrieverFunctionAliasPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BankListRetrieverFunction.Alias
      Principal: apigateway.amazonaws.com

  StubBanksEndpointParameter:
    Condition: IsDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/bank-list/STUB/endpoint-url"
      Description: Banks endpoint for STUB
      Type: String
      Value: !FindInMap [ ProfileEndpointMappings, !Ref Environment, StubBanksEndpointUrl ]

  UatBanksEndpointParameter:
    Condition: IsDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/bank-list/UAT/endpoint-url"
      Description: Banks endpoint for UAT
      Type: String
      Value: !FindInMap [ ProfileEndpointMappings, !Ref Environment, UatBanksEndpointUrl ]

  LiveBanksEndpointParameter:
    Condition: IsDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/bank-list/LIVE/endpoint-url"
      Description: Banks endpoint for LIVE
      Type: String
      Value: !FindInMap [ ProfileEndpointMappings, !Ref Environment, LiveBanksEndpointUrl ]

  ####################################################################
  #                                                                  #
  # API config                                                       #
  #                                                                  #
  ####################################################################

  PublicAPIUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Condition: IsDeployedFromPipeline
    DependsOn:
      - PublicAPIStage
    Properties:
      ApiStages:
        - ApiId: !Ref PublicAPI
          Stage: !Ref Environment
      Quota:
        Limit: 500000
        Period: DAY
      Throttle:
        RateLimit: 200 # allowed requests per second
        BurstLimit: 400 # requests the API can handle concurrently

  PrivateAPIUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Condition: IsDeployedFromPipeline
    DependsOn:
      - PrivateAPIStage
    Properties:
      ApiStages:
        - ApiId: !Ref PrivateAPI
          Stage: !Ref Environment
      Quota:
        Limit: 500000
        Period: DAY
      Throttle:
        RateLimit: 200 # allowed requests per second
        BurstLimit: 400 # requests the API can handle concurrently

  LinkUsagePlanApiKey1:
    Condition: IsDeployedFromPipeline
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !ImportValue core-infrastructure-ApiKey1
      KeyType: API_KEY
      UsagePlanId: !Ref PublicAPIUsagePlan

  LinkUsagePlanApiKey2:
    Condition: IsDeployedFromPipeline
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !ImportValue core-infrastructure-ApiKey2
      KeyType: API_KEY
      UsagePlanId: !Ref PublicAPIUsagePlan

  ####################################################################
  #                                                                  #
  # Parameters                                                       #
  #                                                                  #
  ####################################################################

  VerifiableCredentialKmsSigningKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/verifiableCredentialKmsSigningKeyId"
      Type: String
      Value: !ImportValue core-infrastructure-CriVcSigningKey1Id
      Description: Verifiable Credential Key Id

  LoggingKmsKey:
    Type: AWS::KMS::Key
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
          - Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource: "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  OAuthCommonStackNameParam:
    Type: AWS::SSM::Parameter
    Condition: CreateTestResourcesParam
    Properties:
      Name: /common-cri/oauth-common/stack-name
      Type: String
      Value: !GetAtt OAuth.Outputs.StackName
      Description: The stack currently used for OAuth (oauth-common). Only required for test-resources.


  ####################################################################
  #                                                                  #
  # Alarms                                                           #
  #                                                                  #
  ####################################################################

  LambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment} - Open Banking CRI"
      AlarmDescription: !Sub Open Banking ${Environment} lambda errors
      ActionsEnabled: true
      AlarmActions:
        - !If [IsProduction, !ImportValue build-notifications-PagerDutySNSTopicArn, !ImportValue build-notifications-CriticalAlertsTopicArn]
      OKActions:
        - !If [IsProduction, !ImportValue build-notifications-PagerDutySNSTopicArn, !ImportValue build-notifications-CriticalAlertsTopicArn]
      InsufficientDataActions: []
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Dimensions: []
      Period: 300
      DatapointsToAlarm: 3
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  APIGW5XXErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: AlarmsEnabled
    Properties:
      AlarmName: !Sub "${AWS::StackName}-${Environment}-APIGW-5XX-Errors"
      AlarmDescription: !Sub Open Banking ${Environment} API Gateway 5XX errors
      ActionsEnabled: true
      AlarmActions:
        - !If [IsProduction, !ImportValue build-notifications-PagerDutySNSTopicArn, !ImportValue build-notifications-CriticalAlertsTopicArn]
      OKActions:
        - !If [IsProduction, !ImportValue build-notifications-PagerDutySNSTopicArn, !ImportValue build-notifications-CriticalAlertsTopicArn]
      InsufficientDataActions: [ ]
      DatapointsToAlarm: 3
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Metrics:
        - Id: e1
          Label: Expression1
          ReturnData: true
          Expression: SUM(METRICS())
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5XXError
              Dimensions:
                - Name: ApiName
                  Value: !Sub "${AWS::StackName}-PublicAPI"
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApiGateway
              MetricName: 5XXError
              Dimensions:
                - Name: ApiName
                  Value: !Sub "${AWS::StackName}-PrivateAPI"
            Period: 300
            Stat: Sum
  ###################################################################
  #                                                                 #
  # Canary Alarms                                                   #
  #                                                                 #
  ###################################################################

  BasicFunctionCanaryErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: UseCanaryDeploymentAlarms
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmName: !Sub "${AWS::StackName}-${Environment}-BasicFunction-Canary-Errors"
      AlarmDescription: !Sub "Errors returned from the Basic Function Lambda."
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BasicFunction
        - Name: ExecutedVersion
          Value: !GetAtt BasicFunction.Version.Version
      Namespace: AWS/Lambda
      Statistic: Sum
      Unit: Count
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  BasicFunctionCanary5xxErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: UseCanaryDeploymentAlarms
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmName: !Sub "${AWS::StackName}-${Environment}-BasicFunction-Canary-5XX"
      AlarmDescription: !Sub "Basic Lambda returning 5xx response."
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-PrivateAPI"
        - Name: Method
          Value: POST
        - Name: Stage
          Value: !Ref Environment
        - Name: Resource
          Value: /basic-function
      Statistic: Sum
      Unit: Count
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IssueCredentialFunctionCanaryErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: UseCanaryDeploymentAlarms
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmName: !Sub "${AWS::StackName}-${Environment}-IssueCredentialFunction-Canary-Errors"
      AlarmDescription: "Errors returned from the IssueCredential Function Lambda."
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IssueCredentialFunction
        - Name: ExecutedVersion
          Value: !GetAtt IssueCredentialFunction.Version.Version
      Namespace: AWS/Lambda
      Statistic: Sum
      Unit: Count
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  IssueCredentialFunctionCanary5xxErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: UseCanaryDeploymentAlarms
    Properties:
      ActionsEnabled: true
      AlarmActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      OKActions:
        - !ImportValue build-notifications-WarningAlertsTopicArn
      AlarmName: !Sub "${AWS::StackName}-${Environment}-IssueCredentialFunction-Canary-5XX"
      AlarmDescription: "IssueCredential Lambda returning 5xx response."
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-PublicAPI"
        - Name: Method
          Value: POST
        - Name: Stage
          Value: !Ref Environment
        - Name: Resource
          Value: /credential/issue
      Statistic: Sum
      Unit: Count
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ####################################################################
  #                                                                  #
  # Local Dev Core Stub OAuth Client Parameters                      #
  #                                                                  #
  ####################################################################

  IPVCoreStubLocalRedirectURIParameter:
    Condition: IsNotDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/${OAuthStackName}/clients/ipv-core-stub-local/jwtAuthentication/redirectUri"
        - OAuthStackName: !GetAtt OAuth.Outputs.StackName
      Type: String
      Value: !FindInMap [ IPVCoreStubLocalMapping, !Ref Environment, redirectUri ]

  IPVCoreStubLocalIssuerParameter:
    Condition: IsNotDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/${OAuthStackName}/clients/ipv-core-stub-local/jwtAuthentication/issuer"
        - OAuthStackName: !GetAtt OAuth.Outputs.StackName
      Type: String
      Value: !FindInMap [ IPVCoreStubLocalMapping, !Ref Environment, issuer ]

  IPVCoreStubLocalAudienceParameter:
    Condition: IsNotDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/${OAuthStackName}/clients/ipv-core-stub-local/jwtAuthentication/audience"
        - OAuthStackName: !GetAtt OAuth.Outputs.StackName
      Type: String
      Value:
        !FindInMap [ IPVCoreStubLocalMapping, !Ref Environment, audience ]

  IPVCoreStubLocalPublicSigningJwkBase64Parameter:
    Condition: IsNotDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/${OAuthStackName}/clients/ipv-core-stub-local/jwtAuthentication/publicSigningJwkBase64"
        - OAuthStackName: !GetAtt OAuth.Outputs.StackName
      Type: String
      Value: !FindInMap [ IPVCoreStubLocalMapping, !Ref Environment, publicSigningJwkBase64Mapping ]

  IPVCoreStubLocalJwksEndpointParameter:
    Condition: IsNotDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/${OAuthStackName}/clients/ipv-core-stub-local/jwtAuthentication/jwksEndpoint"
        - OAuthStackName: !GetAtt OAuth.Outputs.StackName
      Type: String
      Value: !FindInMap [ IPVCoreStubLocalMapping, !Ref Environment, jwksEndpoint ]

  IPVCoreStubLocalAuthenticationAlgParameter:
    Condition: IsNotDeployedFromPipeline
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub
        - "/${OAuthStackName}/clients/ipv-core-stub-local/jwtAuthentication/authenticationAlg"
        - OAuthStackName: !GetAtt OAuth.Outputs.StackName
      Type: String
      Value: !FindInMap [ IPVCoreStubLocalMapping, !Ref Environment, authenticationAlg ]

  ####################################################################
  #                                                                  #
  # Code Deploy Service Role                                         #
  #                                                                  #
  ####################################################################

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - codedeploy.amazonaws.com
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda
      PermissionsBoundary: !If [ UsePermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue ]

####################################################################
#                                                                  #
# Outputs                                                          #
#                                                                  #
####################################################################

Outputs:
  StackName:
    Description: CloudFormation stack name
    Value: !Sub "${AWS::StackName}"

  PublicApiGatewayId:
    Description: CRI Open Banking Public API Gateway ID
    Value: !Sub "${PublicAPI}"
    Export:
      Name: !Sub ${AWS::StackName}-PublicAPIGatewayID

  PublicApiBaseUrl:
    Description: Base url of the Public Open Banking API Gateway
    Value: !Sub "https://${PublicAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub ${AWS::StackName}-PublicApiBaseUrl

  PrivateApiGatewayId:
    Description: CRI Open Banking Private API Gateway ID
    Value: !Sub "${PrivateAPI}"
    Export:
      Name: !Sub ${AWS::StackName}-PrivateAPIGatewayID

  PrivateApiBaseUrl:
    Description: Base url of the Private Open Banking API Gateway
    Value: !Sub "https://${PrivateAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub ${AWS::StackName}-PrivateAPIBaseUrl

  IpvCoreBackApiKeyId:
    Condition: IsDeployedFromPipeline
    Description: The key id of the api key used by IPV Core to access open banking back external api gateway
    Value: !Ref LinkUsagePlanApiKey1
