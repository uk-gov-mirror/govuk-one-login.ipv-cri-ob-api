name: PR check

on: pull_request
permissions: {}

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest
    concurrency:
      group: pre-commit-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          all-files: true
          install-dependencies: 'true'
          node-version-file: '.nvmrc'

  tests:
    name: Run tests
    permissions:
      contents: read
    uses: ./.github/workflows/run-tests.yml
    with:
      suites: '["unit", "infra"]'
      coverage-suite: unit

  scan-repo:
    name: CodeQL and Sonar scans
    permissions:
      contents: read
      security-events: write
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs: tests
    uses: ./.github/workflows/scan-repo.yml
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # pact test placeholder

  deploy-preview:
    name: Deploy preview stack
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-preview.yml
    secrets:
      role_arn: ${{ secrets.DEV_GHA_PREVIEW_ROLE_ARN }}
      bucket_name: ${{ secrets.DEV_PREVIEW_ARTIFACT_BUCKET }}

  api-tests:
    name: Run api tests
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: api-tests-${{ github.event.pull_request.number }}
    needs: deploy-preview
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node
        uses: govuk-one-login/github-actions/node/install-dependencies@3a8d0b3fdd010f27ed9cbb2b6c426cd56a23b3e4
        with:
          node-version-file: '.nvmrc'

      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEV_GHA_PREVIEW_ROLE_ARN }}
          aws-region: ${{ needs.deploy-preview.outputs.aws-region }}

      - name: Wait 2 mins for stack to stabilise (TODO - remove post LIME-2470)
        run: sleep 120

      - name: Run tests
        env:
          SAM_STACK_NAME: ${{ needs.deploy-preview.outputs.stack-name }}
          AWS_REGION: ${{ needs.deploy-preview.outputs.aws-region }}
        run: bash test/acceptance-tests/run-tests.sh

  delete-preview:
    name: Delete preview stack
    permissions:
      id-token: write
    needs:
      - deploy-preview
      - api-tests
    if: ${{ always() && needs.deploy-preview.outputs.stack-name != '' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEV_GHA_PREVIEW_ROLE_ARN }}
          aws-region: ${{ needs.deploy-preview.outputs.aws-region }}

      - name: Delete stack
        env:
          STACK_NAME: ${{ needs.deploy-preview.outputs.stack-name }}
        run: |
          for attempt in 1 2 3 4; do
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" && exit 0
            echo "Delete attempt $attempt failed, retrying in $((attempt * 60))s"
            sleep $((attempt * 60))
          done
          exit 1

  merge-status:
    name: Merge status
    runs-on: ubuntu-latest
    concurrency:
      group: merge-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    needs:
      - pre-commit
      - tests
      - api-tests
    if: always()
    steps:
      - run: |
          failed=()
          [[ "${{ needs.pre-commit.result }}" != "success" ]] && failed+=("pre-commit")
          [[ "${{ needs.tests.result }}" != "success" ]] && failed+=("tests")
          [[ "${{ needs.api-tests.result }}" != "success" ]] && failed+=("api-tests")
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "The following jobs failed: ${failed[*]}"
            exit 1
          fi
